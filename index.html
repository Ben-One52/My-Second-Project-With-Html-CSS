<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link href="styles.css" rel="stylesheet">
  <title>Contact form</title>
</head>
<body>
  <div class="form-container">
    <h1>Contact Us</h1>
    <form class="form">
      <div class="form-row">
        <div class="form-group">
          <label for="first-name">First Name *</label>
          <input type="text" name="first-name" id="first-name" required>
        </div>
        <div class="form-group">
          <label for="last-name">Last Name *</label>
          <input type="text" name="last-name" id="last-name" required>
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label id="l1">Query Type</label>
        <div class="radio second-radio">
          <input type="radio" id="general" name="query"/><label for="general">General Enquiry</label>
        </div>
        <div class="radio second-radio">
          <input type="radio" id="support" name="query">
          <label for="support">Support Request</label>
        </div>
      </div>
      <div class="form-group">
        <label for="message" id="text-site">Message *</label>
        <textarea
          rows="5"
          cols="54"
          name="message"
          id="message"
          required></textarea>
      </div>
      <div class="form-group">
        <div class="checkbox">
           <input type="checkbox" id="checkbox" name="consent"/><label for="checkbox">I consent to being contacted by the team</label>
        </div>
        <button type="submit">
          Submit
        </button>
      </div>
    </form>
  </div>
  <footer>
  </footer>
</body>
</html>
